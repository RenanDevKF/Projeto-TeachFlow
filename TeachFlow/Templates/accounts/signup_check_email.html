{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirme seu e-mail - TeachFlow</title>
    <link href="{% static 'css/build.css' %}" rel="stylesheet">
</head>

<body class="flex min-h-screen items-center justify-center bg-gray-50 px-4">
    <div class="w-full max-w-md rounded-xl border border-gray-200 bg-white p-8 text-center shadow-sm">
        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-blue-100">
            <span class="text-xl">✉</span>
        </div>

        <h1 class="mt-5 text-2xl font-bold text-gray-900">
            Confira seu e-mail
        </h1>

        <p class="mt-3 text-sm leading-6 text-gray-600">
            Enviamos um link de confirmação para o e-mail informado no cadastro.
            Acesse esse link para liberar sua conta no TeachFlow.
        </p>

        <p class="mt-3 text-sm text-gray-500">
            O link de confirmação expira em 24 horas.
        </p>

        <a
            href="{% url 'login' %}"
            class="mt-6 inline-flex h-10 items-center justify-center rounded-lg border border-gray-300 bg-white px-4 text-sm font-medium text-gray-700 hover:bg-gray-50"
        >
            Voltar para o login
        </a>
    </div>
</body>
</html>
